name: Import original text, pages, images and thumbnails

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils imagemagick
      - run: python tools/import_text.py
      - run: python tools/import_pages.py
      - run: python tools/import_assets.py
      - run: python tools/make_pub_thumbs.py
      - name: Shrink oversized images (longest side 1600px)
        run: find assets/legacy -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -size +400k -exec mogrify -resize '1600x1600>' -strip {} +
      - name: Commit new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data content
          git diff --cached --quiet || git commit -m "Import original text and images from the old site"
          git push
