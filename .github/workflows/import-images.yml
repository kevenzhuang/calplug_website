name: Import images only

# Downloads images listed in data/, content/legacy/ and tools/import_assets.py (EXTRA) from the old site.
# Unlike "Import original text, pages, images and thumbnails", it never rewrites data or pages.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/import_assets.py
      - name: Commit new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Import images from the old site"
          git push
